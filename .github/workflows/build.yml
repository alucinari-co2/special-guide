name: Build

on:
  push:
    branches:
      - master
      - main
      - 'github-releases/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Display name for the built app'
        required: false
        default: 'Termux'
      app_package:
        description: 'Application package/namespace (e.g. com.termux)'
        required: false
        default: 'com.termux'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Check out termux-app source
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: master

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Resolve custom app name and package
        id: vars
        shell: bash
        run: |
          # Use workflow_dispatch inputs when present; fall back to defaults.
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_PACKAGE="${{ github.event.inputs.app_package }}"
          APP_NAME="${APP_NAME:-Termux}"
          APP_PACKAGE="${APP_PACKAGE:-com.termux}"

          # Validate APP_NAME: alphanumeric, spaces, hyphens, colons (to allow "Termux:API" style)
          if ! printf '%s' "$APP_NAME" | grep -qE '^[A-Za-z0-9 :_-]+$'; then
            echo "ERROR: app_name contains invalid characters: '$APP_NAME'"
            exit 1
          fi

          # Validate APP_PACKAGE: Android package name convention
          if ! printf '%s' "$APP_PACKAGE" | grep -qE '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "ERROR: app_package is not a valid Android package name: '$APP_PACKAGE'"
            exit 1
          fi

          echo "app_name=$APP_NAME"       >> "$GITHUB_OUTPUT"
          echo "app_package=$APP_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Patch app display name and package in build.gradle
        shell: bash
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"
          APP_PACKAGE="${{ steps.vars.outputs.app_package }}"

          # Replace TERMUX_APP_NAME manifest placeholder in app/build.gradle
          sed -i "s|manifestPlaceholders.TERMUX_APP_NAME = \"Termux\"|manifestPlaceholders.TERMUX_APP_NAME = \"$APP_NAME\"|g" \
            app/build.gradle

          # Replace namespace / package name if a custom one was requested
          if [ "$APP_PACKAGE" != "com.termux" ]; then
            sed -i "s|namespace \"com.termux\"|namespace \"$APP_PACKAGE\"|g" app/build.gradle
            sed -i "s|manifestPlaceholders.TERMUX_PACKAGE_NAME = \"com.termux\"|manifestPlaceholders.TERMUX_PACKAGE_NAME = \"$APP_PACKAGE\"|g" \
              app/build.gradle
          fi

      - name: Build APKs
        shell: bash {0}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # Derive version name from the upstream build.gradle
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ matrix.package_variant }}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH"           >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG"     >> "$GITHUB_ENV"
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> "$GITHUB_ENV"

          echo "Building APKs for '$APK_VERSION_TAG'"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ matrix.package_variant }}"

          if ! ./gradlew assembleDebug; then
            exit_on_error "Build failed for '$APK_VERSION_TAG'."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "APK not found: '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found:"$'\n'"$files_found"
            fi
          done

          echo "Generating sha256sums"
          (cd "$APK_DIR_PATH" && sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums") \
            || exit_on_error "sha256sum generation failed."

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_arm64-v8a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Upload sha256sums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json
